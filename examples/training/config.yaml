data:
  train_data_path: "data/processed"
  #test_data_path: "data/test" # optional held-out test dataset
  #validation_data_path: "data/validation" # optional; otherwise split train_data_path
  split_ratio: 0.8 # training fraction when validation_data_path is omitted
  
model:
  # Below is an example of a transformer model configuration.
  family: "transformer" #cnn | transformer
  architecture: "vision_transformer"
  pretrained_path: "facebook/dino-vitb16" # pretrained model path, other example: "google/vit-base-patch16-224"
  classifier_type: "linear"
  #comment the above lines and uncomment the following lines for a cnn model configuration
  # #uncomment the following line for a cnn model configuration
  # family: "cnn" #cnn | transformer
  # architecture: "efficientnet_v2_m" # resnet101 | inception_v3 | convnext_base | efficientnet_v2_m
  # classifier_type: "mlp" # mlp | linear
train:
  batch_size: 16
  epochs: 5
  learning_rate: 0.001
  optimizer: "adam"
  output_dir: "results"